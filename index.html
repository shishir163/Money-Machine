<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2E2A5E">
<title>Money Machine</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Inter:wght@400;600;800&family=Poppins:wght@500;700;800&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ===== THEME TOKENS ===== */
:root{
  --font: 'Lato', system-ui, sans-serif;
  --r: 18px; --r-sm: 12px;
  --shadow: 0 6px 20px -8px rgba(20,20,50,.28);
  --shadow-lg: 0 18px 46px -14px rgba(20,20,50,.42);
  --pos:#12b886; --neg:#f0526b; --warn:#f59f00;
  --safe-t: env(safe-area-inset-top,0px);
  --safe-b: env(safe-area-inset-bottom,0px);
}
/* Themes set: bg, surface, surface-2, ink, muted, line, brand, brand-2 (gradient), accent-ink */
[data-theme="indigo"]{ --bg:#f4f5fb; --surface:#ffffff; --surface2:#f0f1f9; --ink:#1c1b33; --muted:#8b8aa3; --line:#e8e8f2; --brand:#4b3fbd; --brand2:#7b6ef6; --hero:linear-gradient(135deg,#4b3fbd,#8e63f0 55%,#b06ae6); --on-hero:#fff; }
[data-theme="ocean"]{ --bg:#eef6f8; --surface:#ffffff; --surface2:#e5f1f4; --ink:#0f2b33; --muted:#6b8a92; --line:#dcecef; --brand:#0e8f9e; --brand2:#26c2c9; --hero:linear-gradient(135deg,#0b6e8f,#13a6b0 60%,#22cfa9); --on-hero:#fff; }
[data-theme="sunset"]{ --bg:#fdf4ef; --surface:#ffffff; --surface2:#faece4; --ink:#3a1f1a; --muted:#a5837a; --line:#f3e2d8; --brand:#e8622c; --brand2:#ff8a4b; --hero:linear-gradient(135deg,#e0452e,#f47b3a 55%,#ffc24b); --on-hero:#fff; }
[data-theme="forest"]{ --bg:#f0f6f0; --surface:#ffffff; --surface2:#e7f1e7; --ink:#16281a; --muted:#79907d; --line:#ddebdd; --brand:#2f8f4e; --brand2:#57c273; --hero:linear-gradient(135deg,#1f7a44,#3fae5e 55%,#8ed07a); --on-hero:#fff; }
[data-theme="midnight"]{ --bg:#12131c; --surface:#1c1e2b; --surface2:#252838; --ink:#eef0fb; --muted:#8f93ad; --line:#2e3145; --brand:#7c6ff5; --brand2:#a78bfa; --hero:linear-gradient(135deg,#3a2f8f,#6d5cf0 55%,#a06ff0); --on-hero:#fff; --shadow:0 6px 20px -8px rgba(0,0,0,.6); --shadow-lg:0 18px 46px -14px rgba(0,0,0,.7); }
[data-theme="rose"]{ --bg:#fbf0f4; --surface:#ffffff; --surface2:#f7e6ec; --ink:#3a1526; --muted:#a97e8f; --line:#f2dde5; --brand:#d6336c; --brand2:#f06595; --hero:linear-gradient(135deg,#c2255c,#e64980 55%,#ff8fb3); --on-hero:#fff; }

/* --- more day themes --- */
[data-theme="mango"]{ --bg:#fff8ec; --surface:#ffffff; --surface2:#fff0d6; --ink:#3b2a12; --muted:#a38a63; --line:#f6e6c8; --brand:#e8590c; --brand2:#fab005; --hero:linear-gradient(135deg,#f76707,#fd9e2a 55%,#fcc419); --on-hero:#fff; }
[data-theme="lavender"]{ --bg:#f6f3fd; --surface:#ffffff; --surface2:#efe9fb; --ink:#2b2142; --muted:#9086a8; --line:#e9e2f7; --brand:#7048e8; --brand2:#b197fc; --hero:linear-gradient(135deg,#6741d9,#9775fa 55%,#c5b3ff); --on-hero:#fff; }
[data-theme="mint"]{ --bg:#effaf6; --surface:#ffffff; --surface2:#e2f5ee; --ink:#12302a; --muted:#6f948a; --line:#d6efe6; --brand:#0ca678; --brand2:#38d9a9; --hero:linear-gradient(135deg,#087f5b,#12b886 55%,#63e6be); --on-hero:#fff; }
[data-theme="sky"]{ --bg:#eef6ff; --surface:#ffffff; --surface2:#e3efff; --ink:#102a43; --muted:#6b86a3; --line:#dbe8f7; --brand:#1c7ed6; --brand2:#4dabf7; --hero:linear-gradient(135deg,#1864ab,#228be6 55%,#74c0fc); --on-hero:#fff; }
/* --- multi-colour day themes --- */
[data-theme="rainbow"]{ --bg:#f7f6fc; --surface:#ffffff; --surface2:#f0eef9; --ink:#1f1d33; --muted:#8a87a3; --line:#e8e6f3; --brand:#6741d9; --brand2:#f06595; --hero:linear-gradient(120deg,#e03131,#e8590c 22%,#f08c00 40%,#2f9e44 60%,#1971c2 78%,#6741d9); --on-hero:#fff; }
[data-theme="aurora"]{ --bg:#f1f8f7; --surface:#ffffff; --surface2:#e5f2f1; --ink:#13292b; --muted:#6f8f91; --line:#d9ecea; --brand:#4c6ef5; --brand2:#ae3ec9; --hero:linear-gradient(135deg,#0ca678,#15aabf 38%,#4c6ef5 70%,#ae3ec9); --on-hero:#fff; }
[data-theme="candy"]{ --bg:#fdf2f8; --surface:#ffffff; --surface2:#f8e7f1; --ink:#331a2c; --muted:#a3849a; --line:#f3dcea; --brand:#be4bdb; --brand2:#5c7cfa; --hero:linear-gradient(135deg,#e64980,#cc5de8 45%,#5c7cfa 80%,#22b8cf); --on-hero:#fff; }
[data-theme="tropical"]{ --bg:#f2fbf6; --surface:#ffffff; --surface2:#e5f5ec; --ink:#16301f; --muted:#76967f; --line:#d8eedf; --brand:#2b8a3e; --brand2:#f76707; --hero:linear-gradient(135deg,#2b8a3e,#37b24d 30%,#f59f00 65%,#f76707); --on-hero:#fff; }
/* --- night themes --- */
[data-theme="nightocean"]{ --bg:#0b1622; --surface:#122232; --surface2:#1a2d40; --ink:#e6f1fb; --muted:#7f97ad; --line:#23394d; --brand:#22b8cf; --brand2:#4dabf7; --hero:linear-gradient(135deg,#0b4f6c,#0b7285 50%,#15aabf); --on-hero:#fff; }
[data-theme="neon"]{ --bg:#0d0b14; --surface:#17141f; --surface2:#211c2c; --ink:#f3eefc; --muted:#9a90b0; --line:#2c2639; --brand:#e64980; --brand2:#22b8cf; --hero:linear-gradient(135deg,#c2255c,#9c36b5 45%,#1098ad); --on-hero:#fff; }
[data-theme="emerald"]{ --bg:#0b1410; --surface:#121f19; --surface2:#1a2b23; --ink:#e7f7ef; --muted:#82a596; --line:#24382e; --brand:#20c997; --brand2:#94d82d; --hero:linear-gradient(135deg,#087f5b,#0ca678 50%,#66a80f); --on-hero:#fff; }
[data-theme="amber"]{ --bg:#15110b; --surface:#1f1912; --surface2:#2a2219; --ink:#fbf1e2; --muted:#a8957a; --line:#382e22; --brand:#f59f00; --brand2:#ff922b; --hero:linear-gradient(135deg,#d9480f,#f76707 50%,#f59f00); --on-hero:#fff; }
[data-theme="galaxy"]{ --bg:#0c0a1a; --surface:#15122a; --surface2:#1f1a3a; --ink:#efeaff; --muted:#948bbd; --line:#2a2450; --brand:#9775fa; --brand2:#f06595; --hero:linear-gradient(135deg,#5f3dc4,#ae3ec9 35%,#e64980 65%,#f59f00); --on-hero:#fff; }
[data-theme="amoled"]{ --bg:#000000; --surface:#0d0d0f; --surface2:#18181c; --ink:#f2f2f7; --muted:#8e8e98; --line:#222228; --brand:#9775fa; --brand2:#e599f7; --hero:linear-gradient(135deg,#3b2a8f,#7048e8 55%,#ae3ec9); --on-hero:#fff; }
[data-theme="midnight"],[data-theme="nightocean"],[data-theme="neon"],[data-theme="emerald"],[data-theme="amber"],[data-theme="galaxy"],[data-theme="amoled"]{
  --shadow:0 6px 20px -8px rgba(0,0,0,.6); --shadow-lg:0 18px 46px -14px rgba(0,0,0,.75); color-scheme:dark; }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  font-weight:700; line-height:1.35; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(78px + var(--safe-b)); overflow-x:hidden;
  transition:background .25s,color .25s;
}
button{font-family:inherit;font-weight:700;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-weight:700;}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.muted{color:var(--muted);}
.pos{color:var(--pos);} .neg{color:var(--neg);}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:-.02em;}

/* ===== APP HEADER ===== */
.appbar{position:sticky;top:0;z-index:40;background:var(--hero);color:var(--on-hero);
  padding:calc(14px + var(--safe-t)) 18px 16px;border-radius:0 0 26px 26px;box-shadow:var(--shadow);}
.appbar .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.02em;}
.brand .logo{width:32px;height:32px;flex:0 0 auto;}
.iconbtn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;color:#fff;font-size:19px;}
.iconbtn:active{transform:scale(.92);}

/* ===== VIEWS ===== */
.view{display:none;padding:16px 14px 8px;max-width:640px;margin:0 auto;animation:fade .22s ease;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.sectitle{font-size:13px;font-weight:900;text-transform:none;color:var(--muted);margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center;}
.sectitle a{color:var(--brand);font-size:13px;}

/* ===== CARDS ===== */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;border:1px solid var(--line);}
.card+.card{margin-top:12px;}

/* ===== HERO BALANCE (dashboard) ===== */
.hero{background:var(--hero);color:var(--on-hero);border-radius:22px;padding:20px;box-shadow:var(--shadow-lg);border:none;position:relative;overflow:hidden;}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12);}
.hero .lbl{opacity:.85;font-size:13px;}
.hero .bal{font-size:40px;font-weight:900;margin:2px 0 4px;line-height:1;}
.hero .sub{display:flex;gap:16px;margin-top:14px;font-size:12.5px;opacity:.95;}
.hero .sub b{display:block;font-size:16px;}

/* ===== STAT GRID ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 14px;box-shadow:var(--shadow);}
.stat .k{font-size:12px;color:var(--muted);}
.stat .v{font-size:20px;font-weight:900;margin-top:2px;}

/* ===== LIST ROWS ===== */
.row-item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);}
.row-item:last-child{border-bottom:none;}
.avatar{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:0 0 auto;color:#fff;}
.row-item .mid{flex:1;min-width:0;}
.row-item .mid .t{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-item .mid .s{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.row-item .amt{font-size:15.5px;font-weight:900;text-align:right;white-space:nowrap;}
.src-tag{display:inline-flex;align-items:center;gap:3px;background:var(--surface2);color:var(--muted);
  padding:1px 7px;border-radius:20px;font-size:10.5px;font-weight:800;}

/* swipe-to-action rows */
.swipe{position:relative;overflow:hidden;}
.swipe>.acts{position:absolute;top:0;right:0;bottom:0;display:flex;}
.swipe>.acts button{width:74px;color:#fff;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.swipe>.acts button .ic{font-size:17px;}
.swipe>.acts .e{background:var(--brand);}
.swipe>.acts .d{background:var(--neg);}
.swipe>.fg{position:relative;background:var(--surface);transition:transform .2s cubic-bezier(.2,.8,.2,1);touch-action:pan-y;}
.swipe:last-child .row-item{border-bottom:none;}
.hint-swipe{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 0;opacity:.75;}

/* search */
.searchbar{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:13px 15px;box-shadow:var(--shadow);color:var(--muted);font-size:14.5px;margin-bottom:14px;text-align:left;}
.searchbar svg{width:20px;height:20px;stroke:var(--brand);flex:0 0 auto;}
.sheet.tall{min-height:88vh;}
.sq-wrap{position:sticky;top:-18px;z-index:2;background:var(--surface);padding:4px 0 8px;margin-top:-4px;}
.sq{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1.5px solid var(--brand);border-radius:14px;padding:4px 6px 4px 12px;}
.sq svg{width:19px;height:19px;stroke:var(--brand);flex:0 0 auto;}
.sq input{flex:1;border:none;background:none;outline:none;color:var(--ink);font-size:16px;padding:9px 0;min-width:0;}
.sq .clr{width:30px;height:30px;border-radius:9px;color:var(--muted);font-size:15px;}
.sgrp{font-size:12.5px;font-weight:900;color:var(--muted);margin:14px 2px 6px;display:flex;justify-content:space-between;}
.ssum{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.ssum span{background:var(--surface2);border-radius:10px;padding:6px 10px;font-size:12.5px;}
mark{background:#ffe066;color:#1c1b33;border-radius:4px;padding:0 2px;}
.stips{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:6px;}
.stips code{background:var(--surface2);color:var(--ink);padding:1px 6px;border-radius:6px;font-family:inherit;}

/* report breakdown */
.subwrap{padding:2px 4px 2px 52px;}
.subrow{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0 4px;}
.mtx-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.mtx{border-collapse:collapse;font-size:12px;white-space:nowrap;}
.mtx th,.mtx td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--line);}
.mtx thead th{color:var(--muted);font-weight:800;background:var(--surface2);}
.mtx tbody th{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:800;max-width:140px;overflow:hidden;text-overflow:ellipsis;}
.mtx thead th:first-child{position:sticky;left:0;text-align:left;z-index:1;}
.mtx tr.sub th{font-weight:700;color:var(--muted);padding-left:24px;}
.mtx tr.sub td{color:var(--muted);}
.mtx .tot{font-weight:900;}
.mtx tr.grand th,.mtx tr.grand td{font-weight:900;background:var(--surface2);}
.mtx .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;}
.mtx tr.top{cursor:pointer;}

/* payments tiles */
.htiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.htile{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--hc);border-radius:14px;padding:11px 12px;text-align:left;
  display:grid;grid-template-columns:auto 1fr;column-gap:8px;row-gap:2px;align-items:center;box-shadow:var(--shadow);}
.htile .hi{font-size:20px;grid-row:span 2;}
.htile .hn{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.htile .hv{font-size:15px;font-weight:900;}
.htile.on{background:var(--hc);color:#fff;border-color:var(--hc);}
.htile.on .hn{color:rgba(255,255,255,.85);}
.htile.add{border:1.5px dashed var(--line);border-left:1.5px dashed var(--line);box-shadow:none;color:var(--brand);}
.htile.add .hn{color:var(--brand);}
/* calculator */
.amt-row{display:flex;align-items:center;gap:8px;}
.amt-row .amount-in{flex:1;}
.calcbtn{width:52px;height:52px;border-radius:15px;background:var(--surface2);font-size:24px;flex:0 0 auto;border:1.5px solid var(--line);}
.calcbtn.on{background:var(--brand);border-color:var(--brand);}
.calc{background:var(--surface2);border-radius:18px;padding:10px;margin:8px 0 4px;}
.calc-tape{background:var(--surface);border-radius:12px;padding:6px 12px;max-height:150px;overflow-y:auto;font-size:13.5px;margin-bottom:8px;}
.calc-tape>div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line);}
.calc-tape .ct-tot{border-bottom:none;color:var(--brand);font-weight:900;}
.calc-disp{text-align:right;padding:4px 6px 8px;}
.calc-expr{font-size:18px;color:var(--muted);word-break:break-all;}
.calc-res{font-size:26px;font-weight:900;}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.calc-keys button{height:50px;border-radius:13px;background:var(--surface);font-size:21px;font-weight:800;box-shadow:var(--shadow);touch-action:manipulation;}
.calc-keys button:active{transform:scale(.94);}
.calc-keys .op{color:var(--brand);font-size:24px;}
.calc-keys .fn{color:var(--neg);}
.calc-keys .use{grid-column:span 2;background:var(--brand);color:#fff;font-size:18px;}
/* theme picker */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.tsw{border-radius:14px;padding:6px 6px 8px;border:2px solid transparent;text-align:left;font-size:12px;font-weight:800;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);}
.tsw .g{display:block;height:36px;border-radius:10px;}
.tsw.on{border-color:var(--brand);}

/* app lock */
#lock{position:fixed;inset:0;z-index:100;background:var(--hero);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px 20px calc(24px + var(--safe-b));}
.lk-in{width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;}
.lk-in svg{width:76px;height:76px;margin-bottom:4px;}
.lk-t{font-size:25px;font-weight:900;}
.lk-s{opacity:.92;font-size:15px;}
.lk-in input{width:100%;font-size:30px;text-align:center;letter-spacing:.45em;padding:14px;border-radius:16px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#fff;outline:none;font-family:inherit;font-weight:900;}
.lk-in input::placeholder{color:rgba(255,255,255,.7);letter-spacing:normal;font-size:15px;}
.lk-msg{min-height:20px;font-size:14px;}
.lk-btn{width:100%;padding:15px;border-radius:15px;background:#fff;color:#2b2550;font-size:16px;font-weight:900;}
.lk-forgot{font-size:13.5px;opacity:.85;text-decoration:underline;margin-top:4px;cursor:pointer;}
.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
body.locked{overflow:hidden;}
body.locked .view,body.locked .nav,body.locked .fab,body.locked .scrim{visibility:hidden;}

/* trend card */
.tcard{padding:14px 14px 12px;}
.tc-tabs{margin-bottom:12px;}
.tc-tabs button{padding:8px 4px;font-size:12.5px;}
.tc-head{margin:0 2px 6px;}
.tc-big{font-size:28px;font-weight:900;line-height:1.15;margin-top:2px;}
.tc-delta{font-size:12.5px;margin-top:3px;min-height:18px;}
.tc-delta .up{color:var(--neg);font-weight:900;} .tc-delta .down{color:var(--pos);font-weight:900;} .tc-delta .flat{color:var(--muted);font-weight:900;}
.tc-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px;padding-top:9px;border-top:1px solid var(--line);}
.tc-foot b{color:var(--ink);}
/* account spend box (add record) */
.aspend{margin-top:8px;border-radius:14px;padding:11px 12px 10px;background:var(--surface2);border-left:4px solid var(--ac);}
.as-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--muted);}
.as-top b{font-size:17px;color:var(--ink);}
.as-bars{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;margin:8px 0 6px;height:66px;}
.as-bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;}
.as-bars i{display:block;width:62%;border-radius:5px 5px 2px 2px;background:var(--ac);opacity:.35;}
.as-bars .on i{opacity:1;}
.as-bars em{font-style:normal;font-size:9.5px;color:var(--muted);font-weight:800;}
.as-bars .on em{color:var(--ink);}
.as-bars span{font-size:10px;color:var(--muted);font-weight:800;}
.as-bars .on span{color:var(--ink);}
.as-foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted);}
.as-foot b{color:var(--ink);}
.as-note{font-size:11.5px;color:var(--warn);margin-top:6px;}
/* month table (account detail) */
.amt-tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
.amt-tbl th{font-size:11.5px;color:var(--muted);text-align:right;padding:10px 0 6px;font-weight:800;}
.amt-tbl td{text-align:right;padding:8px 0;border-top:1px solid var(--line);}
.amt-tbl th:first-child,.amt-tbl td:first-child{text-align:left;}
.amt-tbl tr.cur td{font-weight:900;color:var(--brand);}
.amt-tbl tfoot td{font-weight:900;border-top:2px solid var(--line);}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:7px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:13px;white-space:nowrap;color:var(--muted);}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);}

/* progress (budget) */
.bar{height:10px;border-radius:20px;background:var(--surface2);overflow:hidden;}
.bar>span{display:block;height:100%;border-radius:20px;transition:width .5s;}

/* ===== BOTTOM NAV ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;
  background:var(--surface);border-top:1px solid var(--line);padding:8px 6px calc(8px + var(--safe-b));box-shadow:0 -6px 20px -12px rgba(0,0,0,.25);}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);flex:1;max-width:72px;padding:2px 0;}
.nav button svg{width:23px;height:23px;stroke:var(--muted);}
.nav button.on{color:var(--brand);}
.nav button.on svg{stroke:var(--brand);}

/* FAB */
.fab{position:fixed;right:18px;bottom:calc(84px + var(--safe-b));z-index:55;width:60px;height:60px;border-radius:20px;
  background:var(--hero);color:#fff;font-size:32px;display:grid;place-items:center;box-shadow:var(--shadow-lg);}
.fab:active{transform:scale(.9);}

/* ===== MODAL / SHEET ===== */
.scrim{position:fixed;inset:0;background:rgba(15,15,35,.5);z-index:60;display:none;align-items:flex-end;justify-content:center;}
.scrim.open{display:flex;animation:fade .2s;}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + var(--safe-b));
  max-height:92vh;overflow-y:auto;animation:up .28s cubic-bezier(.2,.8,.2,1);}
@keyframes up{from{transform:translateY(100%);}to{transform:none;}}
.sheet h2{font-size:19px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.sheet h2 .x{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-size:18px;}

/* segmented */
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;}
.seg button{flex:1;padding:10px;border-radius:11px;font-size:14px;color:var(--muted);}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}
.seg.exp button.on{color:var(--neg);} .seg.inc button.on{color:var(--pos);}

/* form */
label.f{display:block;font-size:12.5px;color:var(--muted);margin:12px 2px 5px;}
.field,select.field,textarea.field{width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);
  background:var(--surface2);color:var(--ink);font-size:15px;outline:none;}
.field:focus{border-color:var(--brand);}
textarea.field{resize:vertical;min-height:52px;}
.amount-in{font-size:34px;font-weight:900;text-align:center;border:none;background:none;width:100%;color:var(--ink);outline:none;padding:8px 0;}
.btn{width:100%;padding:15px;border-radius:15px;background:var(--brand);color:#fff;font-size:16px;font-weight:900;margin-top:18px;box-shadow:var(--shadow);}
.btn:active{transform:scale(.98);}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none;}
.btn.danger{background:var(--neg);}
.btn.sm{width:auto;padding:9px 16px;font-size:13px;margin-top:0;border-radius:11px;}

/* icon picker grid */
.pickgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:6px;}
.pickgrid button{aspect-ratio:1;border-radius:12px;background:var(--surface2);font-size:20px;display:grid;place-items:center;}
.pickgrid button.on{background:var(--brand);box-shadow:0 0 0 2px var(--brand);}
.colgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:6px;}
.colgrid button{aspect-ratio:1;border-radius:50%;}
.colgrid button.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink);}

/* empty */
.empty{text-align:center;color:var(--muted);padding:34px 20px;font-weight:700;}
.empty .em{font-size:40px;display:block;margin-bottom:8px;}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:14px;font-size:14px;z-index:80;opacity:0;
  transition:.3s;pointer-events:none;box-shadow:var(--shadow-lg);white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* misc */
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:800;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.legend .li{display:flex;align-items:center;gap:9px;font-size:13.5px;}
.legend .dot{width:12px;height:12px;border-radius:4px;flex:0 0 auto;}
.legend .li .v{margin-left:auto;font-weight:900;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.mini{font-size:12px;color:var(--muted);}
.acctcard{border-radius:var(--r);padding:15px 16px;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.acctcard .an{font-size:14px;opacity:.9;}
.acctcard .ab{font-size:24px;font-weight:900;margin-top:3px;}
.acctcard .atype{font-size:11px;opacity:.8;margin-top:6px;text-transform:capitalize;}
@media print{ .nav,.fab,.appbar .iconbtn,.chips{display:none!important;} body{padding:0;} .view{display:none!important;} #printArea{display:block!important;} }
#printArea{display:none;}
</style>

<script>
/* =========================================================
   MONEY MACHINE — data layer, state, helpers
   ========================================================= */
const DB_NAME='moneymachine', DB_VER=2;
let db, ACCOUNTS=[], CATS=[], TXNS=[], SETTINGS={theme:'indigo',font:'Lato',monthlyBudget:0};
let CUR='dash';

const ACCT_TYPES={
  bank:{label:'Bank account',icon:'🏦',grp:'spend'},
  mobile:{label:'Mobile banking',icon:'📱',grp:'spend'},
  cash:{label:'Hand cash',icon:'👛',grp:'spend'},
  card:{label:'Credit card',icon:'💳',grp:'credit'},
  loan:{label:'Loan',icon:'🏛️',grp:'loan'},
  dps:{label:'DPS',icon:'🎯',grp:'save'},
  sanchayapatra:{label:'Sanchayapatra',icon:'📜',grp:'save'},
  insurance:{label:'Life insurance',icon:'🛡️',grp:'save'},
};
const SAVE_TYPES=['dps','sanchayapatra','insurance'];

function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{const d=e.target.result;
    ['accounts','categories','txns','meta','lheads','ledger'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});});
  };
  r.onsuccess=e=>{db=e.target.result;res();};
  r.onerror=e=>rej(e);
});}
function tx(store,mode){return db.transaction(store,mode).objectStore(store);}
function put(store,obj){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(obj);r.onsuccess=()=>res(obj);r.onerror=rej;});}
function del(store,id){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(id);r.onsuccess=res;r.onerror=rej;});}
function all(store){return new Promise((res,rej)=>{const r=tx(store,'readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=rej;});}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- money + dates ---------- */
function fmt(n,opts={}){
  const neg=n<0; const a=Math.abs(Math.round(n));
  const s='Tk '+a.toLocaleString('en-US');
  if(opts.signed) return (neg?'−':'+')+s;
  return (neg?'−':'')+s;
}
const pad=x=>String(x).padStart(2,'0');
function dISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayISO(){return dISO(new Date());}
function monthKey(ts){const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function niceDate(ts){const d=new Date(ts);const t=new Date();
  const same=d.toDateString()===t.toDateString();
  const y=new Date(t);y.setDate(t.getDate()-1);
  if(same)return 'Today';
  if(d.toDateString()===y.toDateString())return 'Yesterday';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+(d.getFullYear()!==t.getFullYear()?" '"+String(d.getFullYear()).slice(2):'');
}
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ---------- lookups ---------- */
const acct=id=>ACCOUNTS.find(a=>a.id===id);
const cat=id=>CATS.find(c=>c.id===id);
function catFull(id){const c=cat(id);if(!c)return null;if(c.parentId){const p=cat(c.parentId);return{...c,name:(p?p.name+' › ':'')+c.name,icon:c.icon||(p&&p.icon),color:c.color||(p&&p.color),topId:c.parentId};}return{...c,topId:c.id};}

/* ---------- balances ---------- */
function balanceOf(id){
  let b=acct(id)?.opening||0;
  for(const t of TXNS){
    if(t.type==='expense'&&t.accountId===id)b-=t.amount;
    else if(t.type==='income'&&t.accountId===id)b+=t.amount;
    else if(t.type==='transfer'){ if(t.accountId===id)b-=t.amount; if(t.toAccountId===id)b+=t.amount; }
  }
  return b;
}
// spendable assets = positive-side accounts (bank/mobile/cash/save), excludes card & loan debt
function netWorth(){let s=0;for(const a of ACCOUNTS){if(a.active===false)continue;s+=balanceOf(a.id);}return s;}

/* ---------- period filters ---------- */
function inMonth(ts,ref=new Date()){const d=new Date(ts);return d.getFullYear()===ref.getFullYear()&&d.getMonth()===ref.getMonth();}
function startOfWeek(d){const x=new Date(d);const g=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-g);return x;}
function sumExpense(list){return list.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);}
function sumIncome(list){return list.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);}
function monthTxns(ref=new Date()){return TXNS.filter(t=>inMonth(t.ts,ref));}

/* =========================================================
   Seed defaults (first run)
   ========================================================= */
async function seedIfEmpty(){
  if(ACCOUNTS.length===0){
    await put('accounts',{id:uid(),name:'Hand Cash',type:'cash',icon:'👛',color:'#12b886',opening:0,active:true});
  }
  if(!CATS.some(c=>c.kind==='income'&&!c.parentId)){
    const I=[['Salary','💼','#12b886'],['Business','🏪','#0e8f9e'],['Interest','🏦','#7048e8'],['Rent income','🏠','#0ca678'],['Gift','🎁','#f06595'],['Others','➕','#868e96']];
    for(const [n,ic,cl] of I)await put('categories',{id:uid(),name:n,icon:ic,color:cl,kind:'income',parentId:null,budget:0});
  }
}

/* Shisir's personal expense category pack — installed once, then editable in-app */
const CATPACK_VERSION='shisir1';
const CATPACK=[
  {name:"Car",icon:"🚗",color:"#4b3fbd",subs:[["Accessories & parts","🔧"],["Car maintenance","🛠️"],["Car wash","🧽"],["Fuel","⛽"],["Parking & Toll","🅿️"],["Tax","🧾"]]},
  {name:"Driver",icon:"🧑‍✈️",color:"#495057",subs:[["Salary","💵"],["Bonus","🎉"],["Advance","💸"],["Food","🍱"],["Tips","🪙"]]},
  {name:"Family",icon:"👨‍👩‍👧",color:"#d6336c",subs:[["Father","👨"],["Mother","👩"],["Bindu's Family","👪"],["Gift","🎁"],["Food","🍽️"],["Eid Purpose","🌙"]]},
  {name:"Food",icon:"🍽️",color:"#f0526b",subs:[["Outside","🍴"],["Takeaway","🥡"]]},
  {name:"Gift",icon:"🎁",color:"#f06595",subs:[["Birthday","🎂"],["Donation","🤲"],["Eid Gift","🌙"],["Jakat","🕌"],["Sarna's Friend","👥"],["Sister/Nephew","👧"],["Sosur Bari","🏠"],["Umaiza's Friend","🧒"],["Wedding","💍"]]},
  {name:"Shisir (own)",icon:"🧔",color:"#0e8f9e",subs:[["Clothing","👕"],["Electronics gadget","💻"],["Food","🍔"],["Food EHD","🥡"],["Medical","🩺"],["Medication","💊"],["Study purpose","📚"],["Mobile","📲"]]},
  {name:"Umaiza",icon:"🧒",color:"#7048e8",subs:[["Food","🍎"],["Medical purpose","🩺"],["Medication","💊"],["Shopping","🛍️"],["Study","📚"],["Toys","🧸"]]},
  {name:"Wife",icon:"👩",color:"#e64980",subs:[["Cash","💵"],["Shopping","🛍️"],["Medical","🩺"],["Medication","💊"],["Mobile","📲"]]},
  {name:"Utilities",icon:"💡",color:"#f59f00",subs:[["Electricity","⚡"],["Gas","🔥"],["Household work","🧹"],["Internet","🌐"],["Maid","🧺"],["Mobile","📲"]]},
  {name:"Travelling",icon:"✈️",color:"#22b8cf",subs:[["Flights","🛫"],["Hotel","🏨"],["Sosur bari","🏠"],["Tours & activities","🎡"],["Transport","🚕"]]},
  {name:"Transport",icon:"🚕",color:"#7950f2",subs:[["Uber","🚗"],["Pathao","🏍️"],["Rickshaw","🛺"]]},
  {name:"Groceries",icon:"🛒",color:"#2f8f4e",subs:[["Fish","🐟"],["Grocery","🛒"],["Household supplies","🧴"],["Meat","🍖"],["Vegetables","🥦"],["Fruits","🍎"]]},
];
async function ensureCatPack(){
  if(SETTINGS.catPack===CATPACK_VERSION)return;
  for(const top of CATPACK){
    let t=CATS.find(c=>!c.parentId&&c.kind==='expense'&&c.name.toLowerCase()===top.name.toLowerCase());
    if(!t){t={id:uid(),name:top.name,icon:top.icon,color:top.color,kind:'expense',parentId:null,budget:0};await put('categories',t);CATS.push(t);}
    for(const [sn,si] of top.subs){
      if(!CATS.some(c=>c.parentId===t.id&&c.name.toLowerCase()===sn.toLowerCase())){
        const s={id:uid(),name:sn,icon:si,color:top.color,kind:'expense',parentId:t.id,budget:0};await put('categories',s);CATS.push(s);
      }
    }
  }
  SETTINGS.catPack=CATPACK_VERSION;await saveSettings();
}

/* Shisir's cards + loan — installed once as accounts (edit each to set due & limit) */
const ACCTPACK_VERSION='shisir1';
const ACCTPACK=[
  {name:"City Amex",type:"card",icon:"💳",color:"#4b3fbd"},
  {name:"EBL Platinum",type:"card",icon:"💳",color:"#0e8f9e"},
  {name:"SCBL Gold",type:"card",icon:"💳",color:"#f59f00"},
  {name:"EBL Loan",type:"loan",icon:"🏛️",color:"#495057"},
];
async function ensureAcctPack(){
  if(SETTINGS.acctPack===ACCTPACK_VERSION)return;
  for(const a of ACCTPACK){
    if(!ACCOUNTS.some(x=>x.name.toLowerCase()===a.name.toLowerCase())){
      const o={id:uid(),name:a.name,type:a.type,icon:a.icon,color:a.color,opening:0,creditLimit:0,linkedBankId:null,monthlyAmount:0,maturityDate:'',active:true};
      await put('accounts',o);ACCOUNTS.push(o);
    }
  }
  SETTINGS.acctPack=ACCTPACK_VERSION;await saveSettings();
}
async function loadAll(){
  ACCOUNTS=await all('accounts'); CATS=await all('categories'); TXNS=await all('txns');
  const m=await all('meta'); const s=m.find(x=>x.id==='settings'); if(s)SETTINGS={...SETTINGS,...s};
  TXNS.sort((a,b)=>b.ts-a.ts);
  LHEADS=(await all('lheads')).sort((a,b)=>(a.order||0)-(b.order||0)); LEDGER=(await all('ledger')).sort((a,b)=>b.ts-a.ts);
}
async function saveSettings(){await put('meta',{id:'settings',...SETTINGS});}

/* =========================================================
   UI utilities
   ========================================================= */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1900);}
function openSheet(html){const s=document.getElementById('sheet');s.classList.remove('tall');s.innerHTML=html;document.getElementById('scrim').classList.add('open');document.body.style.overflow='hidden';}
function closeSheet(){document.getElementById('scrim').classList.remove('open');document.body.style.overflow='';SR_BACK=false;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function go(v){
  CUR=v;
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.getElementById('v-'+v).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.nav===v));
  window.scrollTo(0,0);
  refresh();
}
function refresh(){
  ({dash:renderDash,txn:renderTxns,acct:renderAccounts,budget:renderBudget,pay:renderPay,report:renderReports}[CUR]||renderDash)();
}
function applyTheme(){
  const id=curThemeId(); document.body.dataset.theme=id;
  const fmap={Lato:"'Lato'",Inter:"'Inter'",Poppins:"'Poppins'",Roboto:"'Roboto'",System:'system-ui'};
  document.documentElement.style.setProperty('--font',(fmap[SETTINGS.font]||"'Lato'")+', system-ui, sans-serif');
  document.querySelector('meta[name=theme-color]').setAttribute('content',themeById(id)?.meta||'#4b3fbd');
}
/* =========================================================
   SVG Charts (dependency-free, offline)
   ========================================================= */
function svgBar(data,{h=150,fmtY=v=>v,accent}={}){
  // data:[{label,value,color?}]
  const max=Math.max(1,...data.map(d=>d.value));
  const n=data.length, gap=8, W=Math.max(260,n*46), bw=(W-gap*(n+1))/n;
  const top=18, bh=h-36;
  let bars='',labels='';
  data.forEach((d,i)=>{
    const bhh=Math.max(2,(d.value/max)*bh);
    const x=gap+i*(bw+gap), y=top+bh-bhh;

  for(let i=0;i<=4;i++){const y=T+ch-ch*i/4;

function trendInfo(){

  const dayE=d=>E(t=>new Date(t.ts).toDateString()===d.toDateString());
  const monE=(y,m,upto)=>E(t=>{const d=new Date(t.ts);return d.getFullYear()===y&&d.getMonth()===m&&(!upto||d.getDate()<=upto);});
  if(TREND_MODE==='week'){const ws=startOfWeek(n),cur=(n.getDay()+6)%7,dn=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const data=dn.map((l,i)=>{const d=new Date(ws);d.setDate(ws.getDate()+i);return {label:l,full:d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'}),value:dayE(d)};});

    const total=data.slice(0,M+1).reduce((s,d)=>s+d.value,0);let prev=0;for(let i=0;i<M;i++)prev+=monE(Y-1,i);prev+=monE(Y-1,M,D);

function shade(hex,p){try{let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');
  let r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);
  const f=x=>Math.max(0,Math.min(255,Math.round(x+x*p/100)));
  return `#${[f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}`;}catch(e){return hex;}}

function kfmt(v){v=Math.round(v);return v>=100000?(v/1000).toFixed(0)+'k':v>=10000?(v/1000).toFixed(1).replace(/\.0$/,'')+'k':v.toLocaleString('en-US');}
/* top category → subcategory totals for a list of records (expense only) */
function catBreakdown(list){
  const m={};
  list.filter(t=>t.type==='expense').forEach(t=>{const c=cat(t.categoryId);if(!c)return;
    const top=c.parentId||c.id; const sk=c.parentId?c.id:'_g';
    const o=m[top]||(m[top]={c:catFull(top),v:0,n:0,subs:{}}); o.v+=t.amount;o.n++;
    const so=o.subs[sk]||(o.subs[sk]={id:sk,name:c.parentId?c.name:'General',icon:c.parentId?c.icon:'',v:0}); so.v+=t.amount;});
  return Object.values(m).filter(x=>x.c).map(x=>({...x,subs:Object.values(x.subs).sort((a,b)=>b.v-a.v)})).sort((a,b)=>b.v-a.v);
}
/* category × 12 months for one year */
function catMonthMatrix(y){
  const rows={},tot=Array(12).fill(0);
  TXNS.forEach(t=>{if(t.type!=='expense')return;const d=new Date(t.ts);if(d.getFullYear()!==y)return;const c=cat(t.categoryId);if(!c)return;
    const mo=d.getMonth(),top=c.parentId||c.id,sk=c.parentId?c.id:'_g';
    const r=rows[top]||(rows[top]={c:catFull(top),m:Array(12).fill(0),t:0,subs:{}});r.m[mo]+=t.amount;r.t+=t.amount;tot[mo]+=t.amount;
    const su=r.subs[sk]||(r.subs[sk]={name:c.parentId?c.name:'General',m:Array(12).fill(0),t:0});su.m[mo]+=t.amount;su.t+=t.amount;});
  return {rows:Object.values(rows).filter(r=>r.c).map(r=>({...r,subs:Object.values(r.subs).sort((a,b)=>b.t-a.t)})).sort((a,b)=>b.t-a.t),tot};
}

      if(open)r.subs.forEach(su=>html+=`<tr class="sub"><th>${esc(su.name)}</th>${su.m.map(v=>`<td>${v?kfmt(v):'·'}</td>`).join('')}<td class="tot">${kfmt(su.t)}</td></tr>`);

    html+=`<tr class="grand"><th>Total</th>${M.tot.map(v=>`<td>${v?kfmt(v):'·'}</td>`).join('')}<td class="tot">${kfmt(M.tot.reduce((a,b)=>a+b,0))}</td></tr></tbody></table></div></div>

const ICONS=['🏦','📱','👛','💳','🏛️','🎯','📜','🛡️','💵','💰','🪙','🏧','📈','💼','🏪','🅱️','🟠','💶','🧧','🏠'];
const COLORS=['#4b3fbd','#7048e8','#d6336c','#f0526b','#e8622c','#f59f00','#12b886','#0e8f9e','#2f8f4e','#495057','#f06595','#22b8cf','#7950f2','#fa5252','#40c057','#868e96'];
let AF={};
function openAccount(id,grp){
  const a=id?acct(id):null;
  const defType = a?a.type : (grp==='credit'?'card':grp==='loan'?'loan':grp==='save'?'dps':'bank');
  AF = a ? {...a} : {name:'',type:defType,icon:ACCT_TYPES[defType].icon,color:COLORS[Math.floor(Math.random()*8)],opening:0,creditLimit:0,linkedBankId:null,monthlyAmount:0,maturityDate:'',active:true};
  AF._id=id; AF._grp = grp || ACCT_TYPES[AF.type].grp;
  drawAccountSheet();
}
function drawAccountSheet(){
  const grp=AF._grp;
  const typesInGrp=Object.entries(ACCT_TYPES).filter(([k,v])=>v.grp===grp);
  const isCard=grp==='credit', isLoan=grp==='loan', isSave=grp==='save';
  const banks=ACCOUNTS.filter(a=>['bank','mobile','cash'].includes(a.type));
  let openLabel = isCard?'Current due (Tk)':isLoan?'Outstanding amount (Tk)':isSave?'Amount saved so far (Tk)':'Opening balance (Tk)';
  let openVal = AF.opening<0? -AF.opening : AF.opening;

  let html=`<h2>${AF._id?'Edit':'Add'} ${ACCT_TYPES[AF.type].label.toLowerCase()} <span class="x" onclick="closeSheet()">✕</span></h2>`;
  if(typesInGrp.length>1){
    html+=`<label class="f">Type</label><div class="chips">
      ${typesInGrp.map(([k,v])=>`<button class="chip ${AF.type===k?'on':''}" onclick="AF.type='${k}';AF.icon='${v.icon}';drawAccountSheet()">${v.icon} ${v.label}</button>`).join('')}</div>`;
  }
  html+=`<label class="f">Name</label>
    <input class="field" id="afName" value="${esc(AF.name)}" placeholder="${isCard?'e.g. City Bank Visa':isSave?'e.g. Sonali DPS':'e.g. BRAC Bank'}" oninput="AF.name=this.value">
    <label class="f">${openLabel}</label>
    <input class="field num" id="afOpen" type="number" inputmode="numeric" value="${openVal||''}" placeholder="0" oninput="AF._open=this.value">`;

  if(isCard){html+=`<label class="f">Credit limit (Tk)</label>
    <input class="field num" type="number" inputmode="numeric" value="${AF.creditLimit||''}" placeholder="e.g. 100000" oninput="AF.creditLimit=+this.value||0">`;}
  if(isSave){
    html+=`<label class="f">Monthly amount (Tk) <span class="mini">— for reference</span></label>
      <input class="field num" type="number" inputmode="numeric" value="${AF.monthlyAmount||''}" placeholder="e.g. 5000" oninput="AF.monthlyAmount=+this.value||0">
      <label class="f">Linked bank <span class="mini">— where interest / maturity lands</span></label>
      <select class="field" onchange="AF.linkedBankId=this.value||null">
        <option value="">— none —</option>
        ${banks.map(b=>`<option value="${b.id}" ${AF.linkedBankId===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>
      <label class="f">Maturity date <span class="mini">— reminder to close</span></label>
      <input class="field" type="date" value="${AF.maturityDate||''}" onchange="AF.maturityDate=this.value">`;
  }
  if(isLoan){
    html+=`<label class="f">Monthly EMI (Tk) <span class="mini">— optional</span></label>
      <input class="field num" type="number" inputmode="numeric" value="${AF.monthlyAmount||''}" placeholder="e.g. 12000" oninput="AF.monthlyAmount=+this.value||0">
      <label class="f">Repay from bank <span class="mini">— optional</span></label>
      <select class="field" onchange="AF.linkedBankId=this.value||null">
        <option value="">— none —</option>
        ${banks.map(b=>`<option value="${b.id}" ${AF.linkedBankId===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`;
  }
  html+=`<label class="f">Icon</label><div class="pickgrid">
    ${ICONS.map(i=>`<button class="${AF.icon===i?'on':''}" onclick="AF.icon='${i}';drawAccountSheet()">${i}</button>`).join('')}</div>
    <label class="f">Colour</label><div class="colgrid">
    ${COLORS.map(c=>`<button class="${AF.color===c?'on':''}" style="background:${c}" onclick="AF.color='${c}';drawAccountSheet()"></button>`).join('')}</div>
    <button class="btn" onclick="saveAccount()">${AF._id?'Update':'Add'} account</button>
    ${AF._id?`<button class="btn danger" style="margin-top:10px" onclick="deleteAccount('${AF._id}')">Delete account</button>`:''}`;
  openSheet(html);
}
async function saveAccount(){
  if(!AF.name.trim()){toast('Enter a name');return;}
  let open=parseFloat(AF._open!==undefined?AF._open:(AF.opening<0?-AF.opening:AF.opening))||0;
  if(AF._grp==='credit'||AF._grp==='loan')open=-Math.abs(open);
  const obj={id:AF._id||uid(),name:AF.name.trim(),type:AF.type,icon:AF.icon,color:AF.color,opening:open,
    creditLimit:AF.creditLimit||0,linkedBankId:AF.linkedBankId||null,monthlyAmount:AF.monthlyAmount||0,maturityDate:AF.maturityDate||'',active:true};
  await put('accounts',obj);await loadAll();closeSheet();toast(AF._id?'Account updated':'Account added');refresh();
}
async function deleteAccount(id){
  const used=TXNS.some(t=>t.accountId===id||t.toAccountId===id);
  if(used){ if(!confirm('This account has transactions. Delete anyway? (transactions stay but will show unknown account)'))return; }
  await del('accounts',id);await loadAll();closeSheet();toast('Account deleted');refresh();
}
/* =========================================================
   Account detail  (+ card pay bill, savings maturity, loan repay)
   ========================================================= */
/* how much went out of (or came into) one account in a month */
function acctMonthSum(id,ref,kind='expense'){return TXNS.filter(t=>t.type===kind&&t.accountId===id&&inMonth(t.ts,ref)).reduce((s,t)=>s+t.amount,0);}
function acctSpendBox(id,kind){
  const a=acct(id); if(!a)return '';
  const n=new Date(),grp=ACCT_TYPES[a.type].grp,isExp=kind==='expense',b=balanceOf(id);
  const months=[];for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);months.push({l:MONTHS[d.getMonth()],v:acctMonthSum(id,d,kind)});}
  const cur=months[5].v,prev=months[4].v,mx=Math.max(1,...months.map(m=>m.v));
  let extra=grp==='credit'?`Due ${fmt(Math.max(0,-b))}${a.creditLimit?` · Limit left ${fmt(Math.max(0,a.creditLimit+b))}`:''}`:grp==='spend'?`Balance ${fmt(b)}`:'';
  return `<div class="aspend" style="--ac:${a.color}">
    <div class="as-top"><span>${a.icon||ACCT_TYPES[a.type].icon} ${esc(a.name)} · ${isExp?'spent':'received'} this month</span><b class="num">${fmt(cur)}</b></div>
    <div class="as-bars">${months.map((m,i)=>`<div class="${i===5?'on':''}"><em class="num">${m.v?kfmt(m.v):'–'}</em><i style="height:${Math.max(3,m.v/mx*34)}px"></i><span>${m.l}</span></div>`).join('')}</div>
    <div class="as-foot"><span>Last month <b class="num">${fmt(prev)}</b></span>${extra?`<span>${extra}</span>`:''}</div>
    ${grp==='credit'&&isExp?`<div class="as-note">💳 This expense adds to the card's due</div>`:''}
  </div>`;
}
function acctMonthTable(id){
  const a=acct(id),grp=ACCT_TYPES[a.type].grp,n=new Date(),rows=[];
  for(let i=0;i<12;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1);
    const out=acctMonthSum(id,d,'expense'),inc=acctMonthSum(id,d,'income'),paid=TXNS.filter(t=>t.type==='transfer'&&t.toAccountId===id&&inMonth(t.ts,d)).reduce((s,t)=>s+t.amount,0);
    rows.push({d,out,inc,paid});}
  const chart=rows.slice(0,6).reverse().map(r=>({label:MONTHS[r.d.getMonth()],value:r.out}));
  let h=`<div class="sectitle">${grp==='credit'?'Spent on this card — month by month':'Spent from this account — month by month'}</div>
    <div class="card">${svgTrend(chart,{hi:5,h:170,color:a.color})}</div>
    <div class="card" style="padding:4px 14px;margin-top:10px"><table class="amt-tbl num"><thead><tr><th>Month</th><th>Spent</th><th>${grp==='credit'?'Paid':'Received'}</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>h+=`<tr class="${i===0?'cur':''}"><td>${MONTHS[r.d.getMonth()]} ${r.d.getFullYear()}</td><td>${r.out?fmt(r.out):'–'}</td><td>${(grp==='credit'?r.paid:r.inc)?fmt(grp==='credit'?r.paid:r.inc):'–'}</td></tr>`);
  const tOut=rows.reduce((s,r)=>s+r.out,0);
  h+=`</tbody><tfoot><tr><td>12 months</td><td>${fmt(tOut)}</td><td>${fmt(rows.reduce((s,r)=>s+(grp==='credit'?r.paid:r.inc),0))}</td></tr></tfoot></table>
    <div class="mini" style="padding:2px 0 10px">Monthly average spent: <b class="num">${fmt(tOut/12)}</b></div></div>`;
  return h;
}
function acctDetail(id){
  const a=acct(id); if(!a)return;
  const b=balanceOf(id); const grp=ACCT_TYPES[a.type].grp;
  const mine=TXNS.filter(t=>t.accountId===id||t.toAccountId===id).slice(0,40);
  const monthOut=sumExpense(monthTxns().filter(t=>t.accountId===id));
  const monthIntoCard=monthTxns().filter(t=>t.type==='transfer'&&t.toAccountId===id).reduce((s,t)=>s+t.amount,0);

  let head='';
  if(grp==='credit'){const due=Math.max(0,-b),lim=a.creditLimit||0,used=lim?Math.round(due/lim*100):0;
    head=`<div class="hero" style="background:linear-gradient(135deg,${a.color},${shade(a.color,-30)})">
      <div class="lbl">${a.icon} ${esc(a.name)} · current due</div><div class="bal num">${fmt(due)}</div>
      ${lim?`<div class="bar" style="margin-top:10px;background:rgba(255,255,255,.25)"><span style="width:${used}%;background:#fff"></span></div>
      <div class="sub"><div>Limit<b class="num">${fmt(lim)}</b></div><div>Available<b class="num">${fmt(Math.max(0,lim-due))}</b></div><div>Used<b>${used}%</b></div></div>`:''}
      </div>
      <div class="grid2"><div class="stat"><div class="k">Spent this month</div><div class="v num neg">${fmt(monthOut)}</div></div>
      <div class="stat"><div class="k">Paid this month</div><div class="v num pos">${fmt(monthIntoCard)}</div></div></div>
      <button class="btn" style="margin-top:12px" onclick="openTransfer(null,'${id}')">Pay card bill</button>`;
  } else if(grp==='loan'){const out=Math.max(0,-b);
    const paidThisMonth=monthTxns().filter(t=>t.type==='transfer'&&t.toAccountId===id).reduce((s,t)=>s+t.amount,0);
    head=`<div class="hero" style="background:linear-gradient(135deg,${a.color},${shade(a.color,-30)})">
      <div class="lbl">${a.icon} ${esc(a.name)} · outstanding</div><div class="bal num">${fmt(out)}</div>
      <div class="sub">${a.monthlyAmount?`<div>EMI<b class="num">${fmt(a.monthlyAmount)}</b></div>`:''}
      <div>Paid this month<b class="num">${fmt(paidThisMonth)}</b></div>
      ${a.linkedBankId?`<div>From<b>${esc(acct(a.linkedBankId)?.name||'')}</b></div>`:''}</div></div>
      <button class="btn" style="margin-top:12px" onclick="openTransfer('${a.linkedBankId||''}','${id}');XF.amount=${a.monthlyAmount||0}||'';drawTransfer()">Pay EMI / repayment</button>`;
  } else if(grp==='save'){
    head=`<div class="hero" style="background:linear-gradient(135deg,${a.color},${shade(a.color,-30)})">
      <div class="lbl">${a.icon} ${esc(a.name)} · saved</div><div class="bal num">${fmt(b)}</div>
      <div class="sub">${a.monthlyAmount?`<div>Monthly<b class="num">${fmt(a.monthlyAmount)}</b></div>`:''}
      ${a.linkedBankId?`<div>Linked<b>${esc(acct(a.linkedBankId)?.name||'')}</b></div>`:''}
      ${a.maturityDate?`<div>Matures<b>${new Date(a.maturityDate).toLocaleDateString('en-GB',{month:'short',year:'numeric'})}</b></div>`:''}</div></div>`;
    if(a.maturityDate){const md=new Date(a.maturityDate),now=new Date();
      if(md<=now)head+=`<div class="card" style="border-color:var(--warn)"><div class="mini" style="color:var(--warn)">⏰ Matured on ${md.toLocaleDateString('en-GB')}. Move the money to the linked bank and close it?</div></div>`;}
    head+=`<div class="two" style="margin-top:12px">
      <button class="btn ghost" onclick="openTransfer('${a.linkedBankId||''}','${id}')">Add contribution</button>
      <button class="btn ghost" onclick="addInterest('${id}')">Add interest</button></div>
      <button class="btn" style="margin-top:10px;background:var(--pos)" onclick="matureAccount('${id}')">Mature → move to bank & close</button>`;
  } else {
    head=`<div class="hero" style="background:linear-gradient(135deg,${a.color},${shade(a.color,-30)})">
      <div class="lbl">${a.icon} ${esc(a.name)}</div><div class="bal num">${fmt(b)}</div>
      <div class="grid2" style="margin-top:12px"><div class="stat" style="background:rgba(255,255,255,.15);border:none;color:#fff"><div class="k" style="color:rgba(255,255,255,.8)">Spent this month</div><div class="v num">${fmt(monthOut)}</div></div>
      <div class="stat" style="background:rgba(255,255,255,.15);border:none;color:#fff"><div class="k" style="color:rgba(255,255,255,.8)">Received</div><div class="v num">${fmt(sumIncome(monthTxns().filter(t=>t.accountId===id)))}</div></div></div></div>`;
  }

  let html=head+(['credit','spend'].includes(grp)?acctMonthTable(id):'')+`<div class="sectitle"><span>History</span><a onclick="openAccount('${id}')">Edit account</a></div><div class="card">`;
  if(mine.length===0)html+=`<div class="empty" style="padding:20px">No transactions yet</div>`;
  else mine.forEach(t=>html+=txnRow(t,true));
  html+=`</div><div style="height:14px"></div><button class="btn ghost" onclick="go('acct')">‹ Back to accounts</button><div style="height:24px"></div>`;

  document.getElementById('v-acct').innerHTML=html; window.scrollTo(0,0);
}
function addInterest(id){
  const a=acct(id);
  const ic=CATS.find(c=>c.kind==='income'&&/interest/i.test(c.name))||CATS.find(c=>c.kind==='income');
  openSheet(`<h2>Add interest <span class="x" onclick="closeSheet()">✕</span></h2>
    <div class="mini" style="margin-bottom:8px">Adds income to ${esc(a.name)}</div>
    <input class="amount-in num" id="intAmt" type="number" inputmode="decimal" placeholder="Tk 0">
    <label class="f">Date</label><input class="field" id="intDate" type="date" value="${todayISO()}">
    <button class="btn" onclick="saveInterest('${id}','${ic?ic.id:''}')">Add interest</button>`);
  setTimeout(()=>document.getElementById('intAmt').focus(),200);
}
async function saveInterest(id,cid){const amt=Math.abs(parseFloat(document.getElementById('intAmt').value)||0);
  if(!amt){toast('Enter amount');return;}
  await put('txns',{id:uid(),type:'income',amount:amt,categoryId:cid,accountId:id,toAccountId:null,note:'Interest',ts:new Date(document.getElementById('intDate').value).getTime()});
  await loadAll();closeSheet();toast('Interest added');acctDetail(id);}
async function matureAccount(id){
  const a=acct(id);const b=balanceOf(id);
  if(!a.linkedBankId){toast('Set a linked bank first (Edit account)');return;}
  if(!confirm(`Move ${fmt(b)} to ${acct(a.linkedBankId).name} and close ${a.name}?`))return;
  if(b>0)await put('txns',{id:uid(),type:'transfer',amount:b,accountId:id,toAccountId:a.linkedBankId,note:'Maturity',ts:Date.now()});
  await put('accounts',{...a,active:false});
  await loadAll();closeSheet?.();toast('Matured & closed');go('acct');
}

let XF={};
function openTransfer(from,to){
  XF={from:from||defaultAcct(),to:to||null,amount:'',dateISO:todayISO(),note:''};
  drawTransfer();
}
function drawTransfer(){
  const opts=(sel,ex)=>ACCOUNTS.filter(a=>a.active!==false).map(a=>`<option value="${a.id}" ${sel===a.id?'selected':''} ${ex===a.id?'disabled':''}>${ACCT_TYPES[a.type].icon} ${esc(a.name)} (${fmt(balanceOf(a.id))})</option>`).join('');
  openSheet(`<h2>Transfer money <span class="x" onclick="closeSheet()">✕</span></h2>
    <input class="amount-in num" id="xfAmt" type="number" inputmode="decimal" placeholder="Tk 0" value="${XF.amount||''}" oninput="XF.amount=this.value">
    <label class="f">From</label><select class="field" onchange="XF.from=this.value;drawTransfer()"><option value="">— choose —</option>${opts(XF.from,XF.to)}</select>
    <label class="f">To</label><select class="field" onchange="XF.to=this.value;drawTransfer()"><option value="">— choose —</option>${opts(XF.to,XF.from)}</select>
    <div class="mini" style="margin:8px 2px">Use this for cash withdrawal, paying a card bill, DPS/insurance contributions or moving savings — it never counts as income or expense.</div>
    <label class="f">Date</label><input class="field" type="date" value="${XF.dateISO}" onchange="XF.dateISO=this.value">
    <label class="f">Note</label><input class="field" value="${esc(XF.note)}" placeholder="optional" oninput="XF.note=this.value">
    <button class="btn" onclick="saveTransfer()">Save transfer</button>`);
}
async function saveTransfer(){
  const amt=Math.abs(parseFloat(XF.amount)||0);
  if(!amt){toast('Enter an amount');return;}
  if(!XF.from||!XF.to){toast('Choose both accounts');return;}
  if(XF.from===XF.to){toast('Pick two different accounts');return;}
  await put('txns',{id:uid(),type:'transfer',amount:amt,accountId:XF.from,toAccountId:XF.to,categoryId:null,note:(XF.note||'').trim(),ts:new Date(XF.dateISO).getTime()});
  await loadAll();closeSheet();toast('Transfer saved');refresh();
}

/* =========================================================
   SEARCH ENGINE
   - words match notes, category › subcategory, account, type, date (AND)
   - "exact phrase"   -exclude   >5000  <500  1000-5000  5k
   - today / yesterday / this week / this month / last month / oct / 2026
   - expense / income / transfer   (also আজ, গতকাল, খরচ, আয়)
   - close-spelling fallback when nothing matches exactly
   ========================================================= */
let SQ='', SR_BACK=false, SR_T=null, SR_MORE=false;
const BN_DIG={'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'};
const MONTH_FULL=['january','february','march','april','may','june','july','august','september','october','november','december'];
function norm(s){return String(s||'').toLowerCase().replace(/[০-৯]/g,d=>BN_DIG[d]).normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
const inL=(t,arr)=>arr.some(x=>norm(x)===t);
function numTok(s){const m=/^(\d+(?:\.\d+)?)(k)?$/.exec(s);return m?parseFloat(m[1])*(m[2]?1000:1):null;}

function parseQuery(q){
  let s=norm(q)
    .replace(/\bthis month\b/g,' @thismonth ').replace(/\blast month\b/g,' @lastmonth ').replace(/\bthis week\b/g,' @thisweek ')
    .replace(/\bthis year\b/g,' @thisyear ');
  const P={text:[],not:[],amt:[],date:[],types:[]};
  const re=/(-?)"([^"]+)"|(\S+)/g; let m;
  while((m=re.exec(s))){
    if(m[2]!==undefined){(m[1]?P.not:P.text).push(m[2]);continue;}
    let t=m[3];
    if(t.length>1&&t[0]==='-'&&!/^-\d/.test(t)){P.not.push(t.slice(1));continue;}
    let r;
    if((r=/^(>=|<=|>|<)(\d+(?:\.\d+)?k?)$/.exec(t))){P.amt.push({op:r[1],v:numTok(r[2])});continue;}
    if((r=/^(\d+(?:\.\d+)?k?)-(\d+(?:\.\d+)?k?)$/.exec(t))){P.amt.push({op:'range',a:numTok(r[1]),b:numTok(r[2])});continue;}
    if(inL(t,['today','আজ','আজকে'])){P.date.push('today');continue;}
    if(inL(t,['yesterday','গতকাল'])){P.date.push('yesterday');continue;}
    if(t==='@thisweek'||t==='week'){P.date.push('week');continue;}
    if(t==='@thismonth'||t==='month'){P.date.push('month');continue;}
    if(t==='@lastmonth'){P.date.push('lastmonth');continue;}
    if(t==='@thisyear'){P.date.push('year:'+new Date().getFullYear());continue;}
    if(/^(19|20)\d\d$/.test(t)){P.date.push('year:'+t);continue;}
    if(/^\d{4}-\d{2}(-\d{2})?$/.test(t)){P.date.push('iso:'+t);continue;}
    const mi=MONTH_FULL.findIndex(x=>x===t||(t.length>=3&&x.startsWith(t)));
    if(mi>=0&&t.length>=3&&!/\d/.test(t)){P.date.push('mon:'+mi);continue;}
    if(inL(t,['expense','expenses','খরচ','ব্যয়'])){P.types.push('expense');continue;}
    if(inL(t,['income','আয়'])){P.types.push('income');continue;}
    if(inL(t,['transfer','transfers','ট্রান্সফার'])){P.types.push('transfer');continue;}
    P.text.push(t);
  }
  return P;
}
function dateOk(ts,f){
  const d=new Date(ts),n=new Date();
  if(f==='today')return d.toDateString()===n.toDateString();
  if(f==='yesterday'){const y=new Date(n);y.setDate(n.getDate()-1);return d.toDateString()===y.toDateString();}
  if(f==='week')return ts>=startOfWeek(n).getTime();
  if(f==='month')return inMonth(ts,n);
  if(f==='lastmonth')return inMonth(ts,new Date(n.getFullYear(),n.getMonth()-1,1));
  if(f.startsWith('year:'))return d.getFullYear()===+f.slice(5);
  if(f.startsWith('mon:'))return d.getMonth()===+f.slice(4);
  if(f.startsWith('iso:'))return dISO(d).startsWith(f.slice(4));
  return true;
}
function amtOk(a,c){if(c.op==='>')return a>c.v;if(c.op==='>=')return a>=c.v;if(c.op==='<')return a<c.v;if(c.op==='<=')return a<=c.v;
  if(c.op==='range')return a>=Math.min(c.a,c.b)&&a<=Math.max(c.a,c.b);return true;}
function txnHay(t){
  const a=acct(t.accountId),to=acct(t.toAccountId),c=catFull(t.categoryId),d=new Date(t.ts);
  return norm([t.note,c?.name,c?.name?.replace(' › ',' '),a?.name,ACCT_TYPES[a?.type]?.label,to?.name,to&&ACCT_TYPES[to.type]?.label,
    t.type,d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear(),MONTH_FULL[d.getMonth()]].filter(Boolean).join(' | '));
}
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}
  for(let j=1;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];}
function wordHit(hay,tok,fuzzy){
  if(hay.includes(tok))return true;
  if(!fuzzy||tok.length<4)return false;
  const lim=tok.length>=7?2:1;
  return hay.split(/[^\p{L}\p{N}]+/u).some(w=>w.length>=3&&(lev(w,tok)<=lim||(w.length>tok.length&&lev(w.slice(0,tok.length),tok)<=lim)));
}
function txnMatch(t,P,fuzzy){
  if(P.types.length&&!P.types.includes(t.type))return false;
  for(const f of P.date)if(!dateOk(t.ts,f))return false;
  for(const c of P.amt)if(!amtOk(t.amount,c))return false;
  const hay=txnHay(t);
  for(const x of P.not)if(hay.includes(x))return false;
  for(const w of P.text){
    const n=numTok(w);
    if(n!==null){ if(t.amount===n||hay.includes(w))continue; return false; }
    if(!wordHit(hay,w,fuzzy))return false;
  }
  return true;
}
function runSearch(q){
  const P=parseQuery(q);
  const empty=!P.text.length&&!P.not.length&&!P.amt.length&&!P.date.length&&!P.types.length;
  if(empty)return null;
  let fuzzy=false;
  let txns=TXNS.filter(t=>txnMatch(t,P,false));
  if(!txns.length&&P.text.some(w=>numTok(w)===null&&w.length>=4)){txns=TXNS.filter(t=>txnMatch(t,P,true));fuzzy=txns.length>0;}
  let accts=[],cats=[];
  const words=P.text.filter(w=>numTok(w)===null);
  if(words.length){
    accts=ACCOUNTS.filter(a=>{const h=norm(a.name+' '+ACCT_TYPES[a.type].label);return words.every(w=>wordHit(h,w,fuzzy));});
    cats=CATS.filter(c=>{const h=norm(catFull(c.id).name+' '+c.kind);return words.every(w=>wordHit(h,w,fuzzy));});
  }
  const leds=LEDGER.filter(e=>ledMatch(e,P,fuzzy));
  return {P,txns,accts,cats,leds,fuzzy};
}
function ledMatch(e,P,fuzzy){
  if(P.types.length)return false;
  for(const f of P.date)if(!dateOk(e.ts,f))return false;
  for(const c of P.amt)if(!amtOk(e.amount,c))return false;
  const h=lhead(e.headId),d=new Date(e.ts);
  const hay=norm([e.note,h?.name,'payment',d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear(),MONTH_FULL[d.getMonth()]].filter(Boolean).join(' | '));
  for(const x of P.not)if(hay.includes(x))return false;
  for(const w of P.text){const n=numTok(w);if(n!==null){if(e.amount===n||hay.includes(w))continue;return false;}if(!wordHit(hay,w,fuzzy))return false;}
  return true;
}

function hl(text,P){
  let s=esc(text); const words=P.text.filter(w=>w.length>=2).sort((a,b)=>b.length-a.length);
  if(!words.length)return s;
  const re=new RegExp('('+words.map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','giu');
  return s.replace(re,'<mark>$1</mark>');
}

  openSheet(`<div class="sq-wrap"><h2 style="margin-bottom:10px">Search <span class="x" onclick="closeSheet()">✕</span></h2>

/* =========================================================
   CALCULATOR — add many prices, result goes into the amount
   ========================================================= */
let CALC={expr:'',target:null};
function calcEval(expr){
  const toks=(expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').match(/\d*\.?\d+|[+\-*/]/g)||[]);
  while(toks.length&&/^[+\-*/]$/.test(toks[toks.length-1]))toks.pop();
  const terms=[];let sign=1,cur=[];
  for(const t of toks){ if(t==='+'||t==='-'){ if(cur.length){terms.push({sign,toks:cur});cur=[];sign=1;} if(t==='-')sign=-sign; } else cur.push(t); }
  if(cur.length)terms.push({sign,toks:cur});
  const items=terms.map(tm=>{ let v=parseFloat(tm.toks[0]); if(isNaN(v))v=0; let txt=tm.toks[0];
    for(let i=1;i+1<tm.toks.length;i+=2){const op=tm.toks[i],n=parseFloat(tm.toks[i+1]); if(op==='*')v*=n; else if(op==='/')v=n?v/n:0; txt+=(op==='*'?' × ':' ÷ ')+tm.toks[i+1];}
    if(tm.toks.length===2)txt+=tm.toks[1]==='*'?' ×':' ÷';
    return {txt:(tm.sign<0?'− ':'')+txt,val:tm.sign*v};});
  const val=Math.round(items.reduce((s,x)=>s+x.val,0)*100)/100;
  return {val,items};
}
function calcFmt(v){return 'Tk '+(Math.round(v*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});}
function calcInner(){
  const R=calcEval(CALC.expr), show=R.items.length>1||R.items.some(i=>/[×÷]/.test(i.txt));
  return `${show?`<div class="calc-tape">${R.items.map((it,i)=>`<div><span>${i+1}. ${esc(it.txt)}</span><b class="num">${calcFmt(it.val)}</b></div>`).join('')}
      <div class="ct-tot"><span>${R.items.length} item${R.items.length===1?'':'s'}</span><b class="num">${calcFmt(R.val)}</b></div></div>`:''}
    <div class="calc-disp"><div class="calc-expr num">${esc(CALC.expr)||'0'}</div><div class="calc-res num">= ${calcFmt(R.val)}</div></div>
    <div class="calc-keys">
      ${['C','⌫','÷','×','7','8','9','−','4','5','6','+','1','2','3','.','0','00'].map(k=>`<button class="${/[÷×−+]/.test(k)?'op':k==='C'||k==='⌫'?'fn':''}" onclick="calcKey('${k}')">${k}</button>`).join('')}
      <button class="use" onclick="calcUse()">✓ Use ${calcFmt(R.val)}</button>
    </div>`;
}
function calcHtml(){return `<div class="calc" id="calcBox">${calcInner()}</div>`;}
function calcRefresh(){const b=document.getElementById('calcBox');if(b)b.innerHTML=calcInner();}
function calcKey(k){
  let e=CALC.expr; const last=e.slice(-1), isOp=c=>/[+−×÷]/.test(c);
  if(k==='C')e='';
  else if(k==='⌫')e=e.slice(0,-1);
  else if(isOp(k)){ if(!e){ if(k==='−')e='−'; } else if(isOp(last))e=e.slice(0,-1)+k; else e+=k; }
  else if(k==='.'){ const seg=e.split(/[+−×÷]/).pop(); if(!seg.includes('.'))e+=(seg?'':'0')+'.'; }
  else e+=k;
  CALC.expr=e; calcRefresh();
}
function toggleCalc(target){

function calcUse(){
  const v=calcEval(CALC.expr).val;
  if(!(v>0)){toast('Total must be more than 0');return;}
  const F=CALC.target==='led'?LF:TF; F.amount=String(v); F.calcOpen=false; CALC.expr='';

async function lockTry(){

  else h+=`<div class="mini" style="margin-bottom:4px">4 to 6 letters or numbers — e.g. <b>2580</b> or <b>tk2026</b>. Capital/small letters don't matter.</div>

async function pinNext(){
  const v=document.getElementById('pfCur').value;

  if(PF.mode==='remove'){PIN_KEYS.forEach(k=>delete SETTINGS[k]);await saveSettings();toast('PIN removed');openSettings();return;}
  PF.step='new';PF.err='';drawPin();
}
async function pinSave(){
  const a=document.getElementById('pfNew').value,b=document.getElementById('pfNew2').value,hint=document.getElementById('pfHint').value.trim();
  if(!pinOk(a)){PF.err='PIN must be 4–6 letters or numbers (no spaces or symbols)';drawPin();return;}
  if(a.toLowerCase()!==b.toLowerCase()){PF.err="The two PINs don't match";drawPin();return;}
  const salt=uid()+uid();
  Object.assign(SETTINGS,{pinSalt:salt,pinHash:await pinHash(a,salt),pinLen:a.length,pinNumeric:/^\d+$/.test(a),pinHint:hint,lockAfter:SETTINGS.lockAfter??30});

   EXCEL (.xlsx) — built on the phone, no internet needed

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(const f of files){
    const nm=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+data.length;
  }
  const cs=central.reduce((s,a)=>s+a.length,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(end.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xesc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');}
function colName(i){let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}
function xlDate(ts){const d=new Date(ts);return (Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/86400000;}
/* styles: 1 header · 2 date · 3 money · 4 bold money · 5 bold text */
function sheetXml(rows,widths){
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';
  if(widths)x+='<cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>';
  x+='<sheetData>';
  rows.forEach((r,ri)=>{x+=`<row r="${ri+1}">`;
    r.forEach((c,ci)=>{if(c===null||c===undefined||c==='')return;const o=(typeof c==='object')?c:{v:c};if(o.v===null||o.v===undefined||o.v==='')return;
      const ref=colName(ci)+(ri+1),st=o.s?` s="${o.s}"`:'';
      x+=typeof o.v==='number'?`<c r="${ref}"${st}><v>${Math.round(o.v*100)/100}</v></c>`:`<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xesc(o.v)}</t></is></c>`;});
    x+='</row>';});
  return x+'</sheetData></worksheet>';
}
function buildXlsx(sheets){
  const NS='http://schemas.openxmlformats.org';
  const files=[
    {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
    {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xesc(s.name.replace(/[\[\]:*?\/\\]/g,' ').slice(0,31))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd mmm yyyy"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE8E6FA"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="6"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="3" fontId="1" fillId="2" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},
  ];
  sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXml(s.rows,s.widths)}));

let XP={period:'month',pay:true};
function xpRange(){
  const n=new Date(), Y=n.getFullYear(), M=n.getMonth();
  const mon=(y,m)=>({label:MONTHS[m]+' '+y,f:ts=>inMonth(ts,new Date(y,m,1)),year:null,months:[[y,m]]});
  const yr=y=>({label:String(y),f:ts=>new Date(ts).getFullYear()===y,year:y,months:Array.from({length:12},(_,i)=>[y,i])});
  if(XP.period==='month')return mon(Y,M);
  if(XP.period==='lastmonth'){const d=new Date(Y,M-1,1);return mon(d.getFullYear(),d.getMonth());}
  if(XP.period==='year')return yr(Y);
  if(XP.period==='lastyear')return yr(Y-1);
  if(XP.period==='report')return REP_MODE==='month'?mon(REP_REF.getFullYear(),REP_REF.getMonth()):yr(REP_REF.getFullYear());
  const all=[...TXNS,...LEDGER].map(t=>t.ts); const first=new Date(all.length?Math.min(...all):Date.now()); const months=[];
  for(let d=new Date(first.getFullYear(),first.getMonth(),1);d<=n;d=new Date(d.getFullYear(),d.getMonth()+1,1))months.push([d.getFullYear(),d.getMonth()]);
  return {label:'All time',f:()=>true,year:null,months};
}
function makeExcel(){
  const R=xpRange(), H=v=>({v,s:1}), B=v=>({v,s:5}), MB=v=>({v,s:4}), MN=v=>({v,s:3});
  const list=TXNS.filter(t=>R.f(t.ts)).sort((a,b)=>a.ts-b.ts);
  const exp=sumExpense(list),inc=sumIncome(list), sheets=[];
  // 1. Records
  const rows=[['Date','Type','Category','Subcategory','Account','To account','Amount (Tk)','Note'].map(H)];
  list.forEach(t=>{const c=cat(t.categoryId),top=c?(c.parentId?cat(c.parentId):c):null;
    rows.push([{v:xlDate(t.ts),s:2},t.type[0].toUpperCase()+t.type.slice(1),t.type==='transfer'?'':(top?.name||''),c&&c.parentId?c.name:'',acct(t.accountId)?.name||'',t.type==='transfer'?(acct(t.toAccountId)?.name||''):'',MN(t.amount),t.note||'']);});
  rows.push([]);rows.push([B('Total expense'),'','','','','',MB(exp)]);rows.push([B('Total income'),'','','','','',MB(inc)]);rows.push([B('Net'),'','','','','',MB(inc-exp)]);
  sheets.push({name:'Records',rows,widths:[13,10,18,20,16,16,14,34]});
  // 2. Category summary
  const bd=catBreakdown(list), cs=[['Category','Subcategory','Amount (Tk)','% of expense'].map(H)];
  bd.forEach(x=>{cs.push([B(x.c.name),'',MB(x.v),{v:exp?Math.round(x.v/exp*1000)/10:0,s:5}]);x.subs.forEach(su=>cs.push(['',su.name,MN(su.v),exp?Math.round(su.v/exp*1000)/10:0]));});
  cs.push([]);cs.push([B('Total'),'',MB(exp),100]);
  sheets.push({name:'By category',rows:cs,widths:[22,24,14,13]});
  // 3. Category × month (for a year)
  if(R.year){const M=catMonthMatrix(R.year), mr=[['Category','Subcategory',...MONTHS,'Total'].map(H)];
    M.rows.forEach(r=>{mr.push([B(r.c.name),'',...r.m.map(v=>v?MB(v):''),MB(r.t)]);r.subs.forEach(su=>mr.push(['',su.name,...su.m.map(v=>v?MN(v):''),MN(su.t)]));});
    mr.push([]);mr.push([B('Total'),'',...M.tot.map(MB),MB(M.tot.reduce((a,b)=>a+b,0))]);
    sheets.push({name:'Category x month '+R.year,rows:mr,widths:[22,22,...Array(12).fill(10),12]});}
  // 4. Month totals
  const mt=[['Month','Income (Tk)','Expense (Tk)','Net (Tk)','Payments (Tk)'].map(H)];
  R.months.forEach(([y,m])=>{const d=new Date(y,m,1),L=TXNS.filter(t=>inMonth(t.ts,d)),i=sumIncome(L),e=sumExpense(L),p=LEDGER.filter(x=>inMonth(x.ts,d)).reduce((s,x)=>s+x.amount,0);
    mt.push([MONTHS[m]+' '+y,MN(i),MN(e),MN(i-e),MN(p)]);});
  sheets.push({name:'Month totals',rows:mt,widths:[12,14,14,14,15]});
  // 5. Payments (separate)
  if(XP.pay){const pl=LEDGER.filter(e=>R.f(e.ts)).sort((a,b)=>a.ts-b.ts),pr=[['Date','Item','Amount (Tk)','Note'].map(H)];
    pl.forEach(e=>pr.push([{v:xlDate(e.ts),s:2},lhead(e.headId)?.name||'Deleted item',MN(e.amount),e.note||'']));
    const bh={};pl.forEach(e=>{const k=lhead(e.headId)?.name||'Deleted item';bh[k]=(bh[k]||0)+e.amount;});
    pr.push([]);pr.push([H('Total by item'),H(''),H('Amount (Tk)')]);
    Object.entries(bh).sort((a,b)=>b[1]-a[1]).forEach(([k,v])=>pr.push(['',k,MN(v)]));
    pr.push([B('Total payments'),'',MB(pl.reduce((s,e)=>s+e.amount,0))]);
    sheets.push({name:'Payments',rows:pr,widths:[13,22,14,34]});}
  // 6. Accounts now
  const ar=[['Account','Type','Balance now (Tk)'].map(H)];
  ACCOUNTS.filter(a=>a.active!==false).forEach(a=>{const b=balanceOf(a.id),cr=ACCT_TYPES[a.type].grp==='credit'||ACCT_TYPES[a.type].grp==='loan';ar.push([a.name,ACCT_TYPES[a.type].label+(cr?' (due)':''),MN(cr?Math.max(0,-b):b)]);});
  sheets.push({name:'Accounts',rows:ar,widths:[22,22,16]});
  const name='Money-Machine-'+R.label.replace(/\s+/g,'-')+'.xlsx';
  return {blob:buildXlsx(sheets),name,R,count:list.length};
}

    <button class="btn ghost" style="margin-top:10px" onclick="downloadExcel()">⬇️ Save to phone</button>`);
}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
function downloadExcel(){const x=makeExcel();downloadBlob(x.blob,x.name);toast('Excel saved');}
async function shareExcel(){
  const x=makeExcel(); let file=null;
  try{file=new File([x.blob],x.name,{type:x.blob.type});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:x.name});toast('Shared');}
    catch(e){if(e&&e.name!=='AbortError'){downloadBlob(x.blob,x.name);toast('Could not open share — file saved instead');}}
  } else {downloadBlob(x.blob,x.name);toast('Saved — share it from Files / Downloads');}
}

const themeById=id=>THEMES.find(t=>t.id===id);
const MQ=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function curThemeId(){
  if(themeById(SETTINGS.theme)?.dark){SETTINGS.nightTheme=SETTINGS.theme;SETTINGS.theme='indigo';SETTINGS.mode='night';saveSettings();}
  const day=themeById(SETTINGS.theme)?SETTINGS.theme:'indigo', night=themeById(SETTINGS.nightTheme)?SETTINGS.nightTheme:'midnight';
  const mode=SETTINGS.mode||'day', dark=mode==='night'||(mode==='auto'&&MQ&&MQ.matches);
  return dark?night:day;
}
if(MQ){const f=()=>{if(SETTINGS.mode==='auto')applyTheme();};MQ.addEventListener?MQ.addEventListener('change',f):MQ.addListener&&MQ.addListener(f);}
function setMode(m){SETTINGS.mode=m;saveSettings();applyTheme();openSettings();}
function themeGrid(dark){
  const sel=dark?(SETTINGS.nightTheme||'midnight'):(SETTINGS.theme||'indigo');
  return `<div class="tgrid">${THEMES.filter(t=>!!t.dark===dark).map(t=>`<button class="tsw ${sel===t.id?'on':''}" style="background:${t.bg};color:${dark?'#e9e9f2':'#25233a'}" onclick="setTheme('${t.id}')">
    <span class="g" style="background:${t.grad}"></span><span>${sel===t.id?'✓ ':''}${t.name}${t.multi?' 🌈':''}</span></button>`).join('')}</div>`;
}

  await openDB(); await loadAll(); await seedIfEmpty(); await ensureCatPack(); await ensureAcctPack(); await loadAll(); await ensureLedgerSeed(); await loadAll();
  applyTheme(); if(SETTINGS.pinHash)showLock(); renderDash();
  if('serviceWorker' in navigator){try{await navigator.serviceWorker.register('sw.js');}catch(e){}}
}
init();
